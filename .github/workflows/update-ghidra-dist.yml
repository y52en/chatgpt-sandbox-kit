name: Update Ghidra distribution

on:
  schedule:
    # 06:17 JST every day. GitHub schedules use UTC.
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Re-publish even when the current manifest already matches
        required: false
        default: false
        type: boolean

concurrency:
  group: ghidra-dist-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve latest public Ghidra release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ghidra/ci/resolve-release.py --github-output "$GITHUB_OUTPUT"

      - name: Read current distribution manifest
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current_tag=''
          current_sha=''
          if git fetch --quiet origin ghidra-dist:refs/remotes/origin/ghidra-dist 2>/dev/null; then
            if git show origin/ghidra-dist:current/manifest.json > "$RUNNER_TEMP/current-manifest.json" 2>/dev/null; then
              current_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$RUNNER_TEMP/current-manifest.json")"
              current_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/current-manifest.json")"
            fi
          fi
          printf 'tag=%s\n' "$current_tag" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$current_sha" >> "$GITHUB_OUTPUT"

      - name: Decide whether an update is required
        id: decision
        env:
          FORCE: ${{ inputs.force || false }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha256 }}
          CURRENT_TAG: ${{ steps.current.outputs.tag }}
          CURRENT_SHA: ${{ steps.current.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          update=false
          if [[ "$FORCE" == 'true' || "$RELEASE_TAG" != "$CURRENT_TAG" || "$RELEASE_SHA" != "$CURRENT_SHA" ]]; then
            update=true
          fi
          echo "update=$update" >> "$GITHUB_OUTPUT"
          if [[ "$update" == false ]]; then
            echo "ghidra-dist is already current: $RELEASE_TAG ($RELEASE_SHA)"
          fi

      - name: Set up required Java
        if: steps.decision.outputs.update == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.release.outputs.java_min }}

      - name: Download, verify, test, and split official Ghidra
        if: steps.decision.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ghidra-dist"
          python3 ghidra/ci/package-release.py \
            --release-json "${{ steps.release.outputs.release_json }}" \
            --output-dir "$RUNNER_TEMP/ghidra-dist" \
            --smoke-test

      - name: Publish verified chunks to orphan ghidra-dist branch
        if: steps.decision.outputs.update == 'true'
        env:
          DIST_DIR: ${{ runner.temp }}/ghidra-dist
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/publish"
          rm -rf "$publish"
          mkdir -p "$publish/current"
          cp -a "$DIST_DIR"/. "$publish/current/"

          cd "$publish"
          git init -q
          git checkout --orphan ghidra-dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current
          git commit -m "Ghidra distribution: $RELEASE_TAG"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:ghidra-dist

      - name: Summary
        shell: bash
        run: |
          {
            echo '### Ghidra distribution updater'
            echo
            echo "- Latest release: \`${{ steps.release.outputs.tag }}\`"
            echo "- SHA-256: \`${{ steps.release.outputs.sha256 }}\`"
            echo "- Updated: \`${{ steps.decision.outputs.update }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
