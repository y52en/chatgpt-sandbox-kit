name: Update vendored binary wheels

# Weekly PyPI refresh plus manual/maintenance runs.
on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_binary_wheels.py"
      - ".github/workflows/update-binary-wheels.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-vendored-binary-wheels
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install updater dependency
        run: python -m pip install --disable-pip-version-check packaging

      - name: Refresh compatible wheels from PyPI
        run: python scripts/update_binary_wheels.py

      - name: Verify tracked parts and reconstructed wheels
        shell: bash
        run: |
          set -euo pipefail
          cd third_party/wheels

          max_size=$(find . -type f -name '*.whl.part*' -printf '%s\n' | sort -nr | head -n1)
          test -n "$max_size"
          test "$max_size" -lt 1048576
          test "$max_size" -le 1000000

          sha256sum --check --strict PARTS-SHA256SUMS
          ./reassemble.sh

      - name: Smoke-test Capstone and Keystone
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/wheel-smoke-venv"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --no-deps \
            third_party/wheels/*.whl

          "$VENV/bin/python" - <<'PY'
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          from keystone import Ks, KS_ARCH_X86, KS_MODE_32

          source = "mov eax, 0x12345678; inc eax"
          encoding, count = Ks(KS_ARCH_X86, KS_MODE_32).asm(source)
          assert count == 2, count

          code = bytes(encoding)
          insns = list(Cs(CS_ARCH_X86, CS_MODE_32).disasm(code, 0x1000))
          assert [insn.mnemonic for insn in insns] == ["mov", "inc"], insns
          assert insns[0].op_str == "eax, 0x12345678", insns[0].op_str

          print("Capstone/Keystone smoke test: PASS")
          PY

          rm -f third_party/wheels/*.whl

      - name: Commit update when artifacts changed
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- third_party/wheels)" ]]; then
            echo "Vendored wheels are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- third_party/wheels
          git commit -m "Update vendored Capstone and Keystone wheels"
          git push
